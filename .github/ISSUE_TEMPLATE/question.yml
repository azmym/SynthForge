name: Question
description: Ask a question about SynthForge.
title: "[Question] <short summary>"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For questions about a specific plugin, please ask on that plugin's own repo.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do? What have you tried?
